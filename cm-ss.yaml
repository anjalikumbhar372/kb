apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: my-ss
  labels:
    app: ss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ss
  template:
    metadata: 
      labels:
        app: ss
spec:
  containers:
    - name: mysql_container
      image: mysql:8.0
      ports:
        - containerPort: 3306

      env:
      -  name: MYSQL_ROOT_PASSWORD
         valuefrom:
           configMapKeyRef:
             name: my-config
             key: MYSQL_ROOT_PASSWORD

      - name: MYSQL_USER
        valuefrom:
          configMapKeyRef:
            name: my-config
            key: MYSQL_USER

      - name: MYSQL_PASSWORD
        valuefrom:
          configMapKeyRef:
            name: my-config
            key: MYSQL_PASSWORD

      - name: MYSQL_DATABASE
        valuefrom:
          configMapKeyRef: 
            name: my-config
            key: MYSQL_DATABASE
     