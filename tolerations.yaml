apiVersion: apps/v1
kind: pod
metadata:
  name: my-pod
  labels:
    app: my-app
spec:
  tolerations:
    - key: "prod"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  containers:
    - name: nginx-cont
      image: nginx:latest
      ports:
        - containerPort: 80
  nodeSelector:
    type: "frontend"