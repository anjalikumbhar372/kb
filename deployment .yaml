apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-Deployment
  lables: 
    app: Deployment
spec:
  replicas: 2
  selector: 
  matchLables:
    app: Deploy
  stratergy: 
    type: RollingUpdate
    RollingUpdat:
    maxSurge: 1
    maxUnavailable: 1
  template:
    metadate:
      lables:
        app: Deploy
    spec:
      containers:
        - name: nginx-cont
          image: nginx:latest
          ports:
            -name: nginx-port
            containers: 80
---
apiVersion: v1
kind: service
metadata:
  name: deploy-svc 
  lables: 
    app: deploy
spec:
  type: NodePort
  selector:
    app: deploy
  ports:
    - port: 80
      targetPort: 80
      NodePort: 30001