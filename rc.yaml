apiVersion: v1
kind: ReplicationController
metadata:
  name: my-rc
  lables:
    app: rc
spec: 
  replicas: 3
  selector:
    app: rc
  template:
    metadata:
      name: rc-template
      lables:
        app: rc

    spec: 
      containers:
        -name: rc-container
        image: nginx:latest
        ports:
          name: nginx-port
          containers: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rc-svc
  lables:
    app: rc
spec:
  type: NodePort
  selector:
    app: rc
  ports:
    -port: 80
    targetPort: 80